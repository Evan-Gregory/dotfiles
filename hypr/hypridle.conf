# Idle daemon. Lock uses the standalone quickshell lock at
# ~/dotfiles/quickshell/Lock.qml (matches the SUPER+Backspace keybind).
# Uncomment the listeners below to enable idle dimming / auto-lock.

general {
    lock_cmd = qs -p $HOME/dotfiles/quickshell/Lock.qml
}

